name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: sheng_defconfig
      steps:
        description: Steps to run (space-separated: kernel userdata payload firmware bootimg)
        required: true
        default: kernel userdata
      target:
        description: EDK II target for the firmware
        type: choice
        options:
          - RELEASE
          - DEBUG
        default: RELEASE
      uefi_repository:
        description: Mu-Silicium base repository for the firmware and the BootShim
        required: false
        default: Project-Silicium/Mu-Silicium
      uefi_ref:
        description: Mu-Silicium commit or ref to pin the firmware and the BootShim to
        required: false
        default: 46e4ac0800862fb3ee6da09f0028fbef4e767648
      uefi_package_repository:
        description: Board UEFI package overlay (Platforms/ and Resources/)
        required: false
        default: xl8757/myron-uefi
      uefi_package_ref:
        description: Board UEFI package ref
        required: false
        default: main
      bootshim_repository:
        description: Repository with the official UniXNU BootShim.S (I-cache sync and image_size)
        required: false
        default: UniXNU/uefi-sheng
      bootshim_ref:
        description: Official BootShim commit or ref
        required: false
        default: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
      dtb:
        description: Device tree in the device repository (empty uses the UEFI package's Resources/DTBs/<board>.dtb)
        required: false
        default: inputs/canoe.dtb
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      pre_build:
        description: Optional shell commands run in the UniXNU checkout before the kernel build
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # prepare-xnu-source.py talks to the GitHub API; unauthenticated requests
  # hit the rate limit mid-build, so hand it the workflow token.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the steps
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          for step in $STEPS; do
            case "$step" in
              kernel|userdata|payload|firmware|bootimg) ;;
              *) echo "::error::unknown step: $step"; exit 1 ;;
            esac
          done

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find mig || echo 'mig not found for iphoneos'

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the host tools
        run: |
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D "$GITHUB_WORKSPACE/device"

      # The firmware step builds a Mu-Silicium checkout, and the boot image step compiles the BootShim from
      # the same checkout. The board package (Platforms/ and Resources/) is an overlay on that base, and the
      # BootShim is the official UniXNU one: it publishes the copied firmware volume to the instruction cache
      # before the jump, and its ARM64 header describes the shim plus the volume (the assertion in bootimg.py).
      - name: Check out the UEFI tree
        if: contains(inputs.steps, 'firmware') || contains(inputs.steps, 'bootimg')
        env:
          UEFI_REPOSITORY: ${{ inputs.uefi_repository }}
          UEFI_REF: ${{ inputs.uefi_ref }}
        run: |
          git init -q uefi
          git -C uefi remote add origin "https://github.com/${UEFI_REPOSITORY}.git"
          git -C uefi fetch -q --depth 1 origin "$UEFI_REF"
          git -C uefi -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          git -C uefi submodule update -q --init --recursive --depth 1
          echo "Mu-Silicium $(git -C uefi rev-parse HEAD)"

      - name: Overlay the board UEFI package
        if: contains(inputs.steps, 'firmware') || contains(inputs.steps, 'bootimg')
        env:
          UEFI_PACKAGE_REPOSITORY: ${{ inputs.uefi_package_repository }}
          UEFI_PACKAGE_REF: ${{ inputs.uefi_package_ref }}
        run: |
          git init -q uefi-package
          git -C uefi-package remote add origin "https://github.com/${UEFI_PACKAGE_REPOSITORY}.git"
          git -C uefi-package fetch -q --depth 1 origin "$UEFI_PACKAGE_REF"
          git -C uefi-package -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          cp -R uefi-package/Platforms/. uefi/Platforms/
          cp -R uefi-package/Resources/. uefi/Resources/
          echo "board package $(git -C uefi-package rev-parse HEAD)"

      - name: Use the official UniXNU BootShim
        if: contains(inputs.steps, 'bootimg')
        env:
          BOOTSHIM_REPOSITORY: ${{ inputs.bootshim_repository }}
          BOOTSHIM_REF: ${{ inputs.bootshim_ref }}
        run: |
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${BOOTSHIM_REPOSITORY}/${BOOTSHIM_REF}/BootShim/BootShim.S" \
            -o uefi/BootShim/BootShim.S
          grep -q 'dc    cvac' uefi/BootShim/BootShim.S
          grep -q 'FD_SIZE + (_Payload - _Head)' uefi/BootShim/BootShim.S

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
          DATA_SEED_URL: ${{ inputs.data_seed_url }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$DATA_SEED_URL" ]; then
            curl -fL "$DATA_SEED_URL" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          elif [ -n "$GROW_GIB" ]; then
            echo "grow_gib needs data_seed_url" >&2
            exit 1
          fi
          if [ "$SKIP_SETUP" = "true" ] && [ ! -f "$RUNNER_TEMP/data.dbr" ]; then
            echo "skip_setup needs data_seed_url" >&2
            exit 1
          fi

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build kernel
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}"

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        env:
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = "true" ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ -n "$UNIQUE_CHIP_ID" ]; then args+=(--unique-chip-id "$UNIQUE_CHIP_ID"); fi
          if [ "$SKIP_SETUP" = "true" ]; then args+=(--skip-setup); fi
          ./unixnu build payload "${args[@]}"

      - name: Build firmware
        if: contains(inputs.steps, 'firmware')
        env:
          UEFI_TARGET: ${{ inputs.target }}
        run: |
          ./unixnu build firmware --uefi "$GITHUB_WORKSPACE/uefi" \
            --edk2 "$GITHUB_WORKSPACE/uefi/Mu_Basecore" --target "$UEFI_TARGET"

      - name: Build boot image
        if: contains(inputs.steps, 'bootimg')
        env:
          UEFI_TARGET: ${{ inputs.target }}
          DTB: ${{ inputs.dtb }}
        run: |
          if [ -n "$DTB" ]; then
            dtb="$GITHUB_WORKSPACE/device/$DTB"
          else
            dtb="$GITHUB_WORKSPACE/uefi/Resources/DTBs/myron.dtb"
          fi
          ./unixnu bootimg --uefi "$GITHUB_WORKSPACE/uefi" --dtb "$dtb" --target "$UEFI_TARGET"
          cat out/*/boot/boot.json

      - name: Upload boot image
        if: contains(inputs.steps, 'bootimg')
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-boot-${{ inputs.defconfig }}
          path: out/*/boot/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-${{ inputs.defconfig }}
          path: |
            out/*/kernel/**
            out/*/payload/**
            out/*/logs/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata
        if: inputs.upload_userdata && contains(inputs.steps, 'userdata')
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-userdata-${{ inputs.defconfig }}
          path: out/*/userdata/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware out/*/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
